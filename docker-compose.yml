services:
  strapi:
    build:
      context: .
      dockerfile: Dockerfile
    image: strapi5-commerce:latest
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_HOST: strapiDB
    ports:
      - "127.0.0.1:1337:1337"
    depends_on:
      strapiDB:
        condition: service_healthy
    volumes:
      - strapi-uploads:/opt/app/public/uploads
    networks:
      - strapi-network

  strapiDB:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - strapi-db:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - strapi-network

volumes:
  strapi-db:
  strapi-uploads:

networks:
  strapi-network:
    name: strapi-network
    driver: bridge
